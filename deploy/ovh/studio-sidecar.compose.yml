name: flowstudio

services:
  studio:
    build:
      context: ../../services/neural-orchestrator
      dockerfile: Dockerfile.ovh
    restart: unless-stopped
    env_file: .env
    volumes:
      - studio_usage:/var/lib/flow-studio
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 768m
    networks:
      intothebattle:
        aliases:
          - flow-studio

volumes:
  studio_usage:

networks:
  intothebattle:
    external: true
    name: intothebattle_default
