steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'services/product-mapper'
  
  # Run tests
  - name: 'node:20'
    entrypoint: npm
    args: ['test']
    dir: 'services/product-mapper'
  
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper:latest'
      - '-f'
      - 'services/product-mapper/Dockerfile'
      - 'services/product-mapper'
  
  # Scan container image
  - name: 'aquasec/trivy'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper:$SHORT_SHA'
  
  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper'
  
  # Deploy to GKE
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=infrastructure/kubernetes/manifests/product-mapper.yaml'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper:$SHORT_SHA'
      - '--location=${_REGION}'
      - '--cluster=affiliate-flow-cluster'
      - '--namespace=affiliate-flow'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/affiliate-flow-images/product-mapper:latest'

substitutions:
  _REGION: us-central1

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
