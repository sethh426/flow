server.port=8092
spring.application.name=integration-service

# Database Configuration
spring.datasource.url=jdbc:h2:mem:integrationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Integration Configuration
spring.integration.poller.fixed-delay=5000
spring.integration.poller.max-messages-per-poll=10

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,integrationgraph
management.endpoint.health.show-details=always

# Logging
logging.level.com.affiliateflow=DEBUG
logging.level.org.springframework.integration=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
