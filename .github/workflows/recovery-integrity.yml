name: Recovery integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check committed files for common secret formats
        shell: bash
        run: |
          pattern='AIza[0-9A-Za-z_-]{25,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|(?:AKIA|ASIA)[0-9A-Z]{16}|ghp_[0-9A-Za-z]{20,}|github_pat_[0-9A-Za-z_]{20,}|sk-(?:proj-)?[0-9A-Za-z_-]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|apify_api_[0-9A-Za-z]{20,}|1//[0-9A-Za-z_-]{20,}'
          if git grep -I -l -P -e "$pattern" -- .; then
            echo 'Potential committed secret formats found in the paths above.'
            exit 1
          fi
          echo 'Secret-format check passed.'

      - name: Validate active architecture contracts
        run: |
          node --test scripts/deployment/check-flow-config.test.mjs
          node scripts/intelligence/validate-registry.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            services/trend-finder/package-lock.json
            services/neural-orchestrator/package-lock.json

      - name: Check recovered backend entry points
        run: |
          node --check functions/index.js
          node --check services/mcp-integration/index.js

      - name: Install and check Trend Finder
        run: |
          npm ci --ignore-scripts --prefix services/trend-finder
          npm run check --prefix services/trend-finder

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Check client production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical --prefix client

      - name: Check the floating studio
        run: |
          npm run studio:type-check --prefix client
          npm run studio:lint --prefix client

      - name: Install selected backend dependencies
        run: npm ci --ignore-scripts --prefix services/neural-orchestrator

      - name: Check backend production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical --prefix services/neural-orchestrator

      - name: Build and test the selected backend
        run: npm run test:studio --prefix services/neural-orchestrator

      - name: Build recovered client
        run: npm run build --prefix client

      - name: Install video verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          cd client
          npx playwright install --with-deps chromium

      - name: Verify studio creation and real video export
        run: npm run studio:test --prefix client

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-diagnostics
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 7
