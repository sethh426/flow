# Manual Flow deployment to the canonical Firebase project
name: Deploy to Firebase Studio

on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: affiliateflow-abzfy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment identity configuration
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::WIF_PROVIDER is not configured"; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo "::error::WIF_SERVICE_ACCOUNT is not configured"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: affiliateflow-abzfy
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: cd client && npm ci
      
      - name: Build Next.js app
        run: |
          node scripts/deployment/check-flow-config.mjs
          cd client
          npm run studio:type-check
          npm run studio:lint
          npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'affiliateflow-abzfy' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      
      - name: Install Functions dependencies
        run: cd services/neural-orchestrator && npm ci
      
      - name: Build Firebase Functions
        run: cd services/neural-orchestrator && npm run test:studio
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy connected backend first
        run: firebase deploy --only functions:studio,functions:productionWorker,functions:api --project affiliateflow-abzfy --non-interactive

      - name: Verify live Studio API before releasing the frontend
        run: node scripts/deployment/check-studio-live.mjs https://affiliateflow-abzfy.web.app

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project affiliateflow-abzfy --non-interactive
      
      - name: Deployment Success
        run: |
          echo "✅ Deployed to Firebase Studio successfully!"
          echo "🌐 Live at: https://affiliateflow-abzfy.web.app"
