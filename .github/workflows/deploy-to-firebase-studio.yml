# Auto-deploy to Firebase Studio on every push
name: Deploy to Firebase Studio

on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: affiliateflow-abzfy

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: cd client && npm ci
      
      - name: Build Next.js app
        run: cd client && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: affiliateflow-abzfy
      
      - name: Install Functions dependencies
        run: cd services/neural-orchestrator && npm ci
      
      - name: Build Firebase Functions
        run: cd services/neural-orchestrator && npm run build
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project affiliateflow-abzfy --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
      
      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project affiliateflow-abzfy --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
      
      - name: Deployment Success
        run: |
          echo "✅ Deployed to Firebase Studio successfully!"
          echo "🌐 Live at: https://affiliateflow-abzfy.web.app"
