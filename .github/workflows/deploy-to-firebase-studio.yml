# Manual release to the reviewed Firebase project
name: Deploy Flow to Firebase

on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: affiliateflow-abzfy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: cd client && npm ci
      
      - name: Build Next.js app
        run: |
          node scripts/deployment/check-flow-config.mjs
          cd client
          npm run studio:type-check
          npm run studio:lint
          npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'affiliateflow-abzfy' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}

      - name: Mark the exported release
        run: node scripts/deployment/write-flow-release.mjs
      
      - name: Install Functions dependencies
        run: cd services/neural-orchestrator && npm ci
      
      - name: Build Firebase Functions
        run: cd services/neural-orchestrator && npm run test:studio
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy Functions and Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo 'FIREBASE_TOKEN is not configured for this manual release.' >&2
            exit 1
          fi
          firebase deploy --only functions,hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --token "$FIREBASE_TOKEN"

      - name: Verify the live release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deployment/verify-flow-release.mjs
