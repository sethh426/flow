# Deploy Flow Orchestrator to Cloud Run
name: Deploy Flow Orchestrator

on:
  workflow_dispatch:

env:
  PROJECT_ID: affiliateflow-abzfy
  SERVICE_NAME: flow-orchestrator
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker
      
      - name: Build and push Docker image
        run: |
          cd services/flow-orchestrator
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest
      
      - name: Create secret for Gemini API Key (if not exists)
        run: |
          if ! gcloud secrets describe GEMINI_API_KEY --project=${{ env.PROJECT_ID }} 2>/dev/null; then
            echo "Creating GEMINI_API_KEY secret..."
            echo -n "${{ secrets.GEMINI_API_KEY }}" | gcloud secrets create GEMINI_API_KEY \
              --project=${{ env.PROJECT_ID }} \
              --data-file=-
          else
            echo "GEMINI_API_KEY secret already exists"
          fi
      
      - name: Grant Cloud Run access to secret
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format="value(projectNumber)")
          gcloud secrets add-iam-policy-binding GEMINI_API_KEY \
            --project=${{ env.PROJECT_ID }} \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" || true
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --port 8080 \
            --timeout 3600 \
            --set-env-vars NODE_ENV=production \
            --set-secrets GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --project ${{ env.PROJECT_ID }}
      
      - name: Get Service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)")
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "WebSocket URL: ${SERVICE_URL/https:/wss:}/flow-autopilot"
      
      - name: Deployment Success
        run: |
          echo "✅ Flow Orchestrator deployed successfully!"
          echo "🌐 Service URL: ${{ steps.get-url.outputs.SERVICE_URL }}"
          echo "🔌 WebSocket: ${{ steps.get-url.outputs.SERVICE_URL }}/flow-autopilot"
          echo ""
          echo "⚠️  Remember to update FlowAutopilot.tsx with the production WebSocket URL!"
