steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'client'
  
  # Run linter
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'lint']
    dir: 'client'
  
  # Build Next.js app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'client'
    env:
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - 'NEXT_PUBLIC_GEMINI_API_KEY=${_GEMINI_API_KEY}'
  
  # Deploy to Firebase Hosting
  - name: 'gcr.io/$PROJECT_ID/firebase'
    args:
      - 'deploy'
      - '--only'
      - 'hosting'
      - '--project'
      - '${_FIREBASE_PROJECT_ID}'
    dir: 'client'

substitutions:
  _FIREBASE_PROJECT_ID: 'flow-69826693-f6d27'
  _FIREBASE_API_KEY: 'REDACTED_SECRET'
  _GEMINI_API_KEY: 'REDACTED_SECRET'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
