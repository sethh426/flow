    <!-- Initialize Firebase -->
    <script>
      const flowPublicConfig = window.FLOW_PUBLIC_CONFIG || {};

      if (typeof firebase !== 'undefined') {
        const hostedFirebaseConfig = firebase.apps.length ? firebase.app().options : {};
        const firebaseConfig = {
          apiKey: flowPublicConfig.firebase?.apiKey || hostedFirebaseConfig.apiKey || '',
          authDomain: flowPublicConfig.firebase?.authDomain || hostedFirebaseConfig.authDomain || 'flowearlyadopters.firebaseapp.com',
          projectId: flowPublicConfig.firebase?.projectId || hostedFirebaseConfig.projectId || 'flowearlyadopters',
          storageBucket: flowPublicConfig.firebase?.storageBucket || hostedFirebaseConfig.storageBucket || 'flowearlyadopters.firebasestorage.app',
          messagingSenderId: flowPublicConfig.firebase?.messagingSenderId || hostedFirebaseConfig.messagingSenderId || '',
          appId: flowPublicConfig.firebase?.appId || hostedFirebaseConfig.appId || ''
        };
        
        if (firebase.apps.length || (firebaseConfig.apiKey && firebaseConfig.appId)) {
          // Initialize Firebase only if not already initialized
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }

          window.analytics = null;
          if (window.location.hostname !== 'localhost') {
            try {
              window.analytics = firebase.analytics();
            } catch (error) {
              console.warn('Firebase Analytics is unavailable:', error);
            }
          }

          window.db = firebase.firestore();
        } else {
          console.warn('Flow Firebase configuration is missing; waitlist submissions will use the local fallback.');
        }
      }

      // AI requests go through a server endpoint so provider keys never reach the browser.
      window.generateAIMessage = async function(prompt, context = {}) {
        const endpoint = flowPublicConfig.aiEndpoint;
        if (!endpoint) return null;

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, context })
          });
          if (!response.ok) throw new Error(`AI endpoint returned ${response.status}`);
          const data = await response.json();
          return (data.message || data.text || '').trim() || null;
        } catch (error) {
          console.warn('Flow AI endpoint error:', error);
          return null;
        }
      };
    </script>

      function WaitlistSignup() {
        const [formData, setFormData] = React.useState({ name: "", email: "", useCase: "" });
        const [errors, setErrors] = React.useState({});
        const [loading, setLoading] = React.useState(false);
        const [submitted, setSubmitted] = React.useState(false);
        const [waitlistCount, setWaitlistCount] = React.useState(0);
        const [userPosition, setUserPosition] = React.useState(null);

        // Load waitlist count on mount and set up real-time listener
        React.useEffect(() => {
          if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
            const db = firebase.firestore();
            
            // Set up real-time listener
            const unsubscribe = db.collection('meta').doc('waitlist')
              .onSnapshot((doc) => {
                if (doc.exists) {
                  setWaitlistCount(doc.data().count || 0);
                }
              }, (error) => {
                console.error('Failed to load waitlist count:', error);
              });
            
            // Cleanup listener on unmount
            return () => unsubscribe();
          }
        }, []);

        const validateEmail = (email) => {
          const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return re.test(email);
        };

        const handleChange = (field) => (event) => {
          setFormData({ ...formData, [field]: event.target.value });
          if (errors[field]) {
            setErrors({ ...errors, [field]: "" });
          }
        };

        const handleSubmit = async (event) => {
          event.preventDefault();
          const newErrors = {};

          if (!formData.name.trim()) {
            newErrors.name = "Name is required";
          }
          if (!formData.email.trim()) {
            newErrors.email = "Email is required";
          } else if (!validateEmail(formData.email)) {
            newErrors.email = "Please enter a valid email";
          }
          if (!formData.useCase.trim()) {
            newErrors.useCase = "Please tell us how you'd use Flow";
          }

          if (Object.keys(newErrors).length > 0) {
            setErrors(newErrors);
            return;
          }

          setLoading(true);
          
          try {
            // Firebase integration
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
              const db = firebase.firestore();
              
              console.log('Checking for duplicate email...');
              // Check for duplicate email
              const existingSignup = await db.collection('waitlist_signups')
                .where('email', '==', formData.email.toLowerCase())
                .limit(1)
                .get();

              if (!existingSignup.empty) {
                setErrors({ email: 'This email is already on the waitlist' });
                setLoading(false);
                return;
              }

              console.log('Adding signup to Firestore...');
              // Add new signup
              const signupData = {
                name: formData.name.trim(),
                email: formData.email.toLowerCase().trim(),
                useCase: formData.useCase.trim(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                userAgent: navigator.userAgent,
                screenResolution: `${screen.width}x${screen.height}`,
                referrer: document.referrer || 'direct',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language
              };

              const docRef = await db.collection('waitlist_signups').add(signupData);
              console.log('Firestore document created:', docRef.id);
              
              // Email notifications disabled - view signups in Firebase Console
              // https://console.firebase.google.com/project/flowearlyadopters/firestore

              console.log('Updating counter...');
              // Increment counter
              const counterDoc = await db.collection('meta').doc('waitlist').get();
              const position = counterDoc.exists ? (counterDoc.data().count || 0) + 1 : 1;

              await db.collection('meta').doc('waitlist').set({
                count: firebase.firestore.FieldValue.increment(1),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              }, { merge: true });

              console.log('Signup complete! Position:', position);
              setUserPosition(position);
              
              // Track analytics
              if (typeof gtag !== 'undefined') {
                gtag('event', 'waitlist_signup', {
                  event_category: 'engagement',
                  event_label: formData.name,
                  value: position
                });
              }
            } else {
              console.error('Firebase not initialized!');
              setErrors({ general: 'System not ready. Please refresh and try again.' });
              setLoading(false);
              return;
            }

            setSubmitted(true);
          } catch (error) {
            console.error('Waitlist signup error:', error);
            console.error('Error code:', error.code);
            console.error('Error message:', error.message);
            setErrors({ general: error.message || 'Something went wrong. Please try again.' });
          } finally {
            setLoading(false);
          }
        };

        if (submitted) {
          return (
            <Paper
              id="waitlist"
              role="region"
              aria-label="Waitlist signup success"
              elevation={0}
              sx={{
                p: { xs: 3, sm: 4, md: 6 },
                borderRadius: { xs: 3, md: 4 },
                border: "2px solid rgba(251, 191, 36, 0.4)",
                background: "linear-gradient(135deg, rgba(251,191,36,0.08), rgba(15,23,42,0.85))",
                textAlign: "center"

      function App() {
        const workflowRef = React.useRef(null);
        const scrollDepthTracked = React.useRef({ 25: false, 50: false, 75: false, 100: false });

        // Track scroll depth
        React.useEffect(() => {
          const handleScroll = () => {
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollPercent = (scrollTop / (documentHeight - windowHeight)) * 100;

            [25, 50, 75, 100].forEach(threshold => {
              if (scrollPercent >= threshold && !scrollDepthTracked.current[threshold]) {
                scrollDepthTracked.current[threshold] = true;
                if (window.trackEvent) {
                  window.trackEvent('scroll_depth', {
                    percent: threshold,
                    page: window.location.pathname
                  });
                }
              }
            });
          };

          window.addEventListener('scroll', handleScroll, { passive: true });
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        // Track page view
        React.useEffect(() => {
          if (window.trackEvent) {
            window.trackEvent('page_view', {
              page_title: document.title,
              page_location: window.location.href
            });
          }
        }, []);

        // Flow companion - nonverbal floating guide with smart tracking
        const [flowState, setFlowState] = React.useState({
          section: 'hero',
          gesture: 'wave',
          active: true,
          contextualHint: null,
          userEngaged: false,
          // Phase 1 - Interactive Intelligence
          showHintBubble: false,
          hintMessage: '',
          emojiReaction: null,
          proximityLevel: 0,
          showConfetti: false,
          // Phase 2 - Contextual Awareness
          scrollHesitation: false,
          formAbandoned: false,
          returningVisitor: false,
          visitCount: 0,
          readingSpeed: 'normal',
          progressPercent: 0,
          // Phase 3 - AI-Powered Features
          conversionProbability: 0.5,
          nextSuggestedSection: null,
          aiHint: null
        });

        // FlowHintBubble Component
        const FlowHintBubble = ({ message, show }) => {
          const [position, setPosition] = React.useState('top');
          const [isHovered, setIsHovered] = React.useState(false);
          const [alignment, setAlignment] = React.useState('center');
          
          React.useEffect(() => {
            const checkPosition = () => {
              const flowEl = document.querySelector('[data-flow-avatar]');
              if (flowEl) {
                const rect = flowEl.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                
                // Check vertical position
                setPosition(rect.top < window.innerHeight * 0.3 ? 'bottom' : 'top');
                
                // Check horizontal alignment to avoid overflow
                const flowCenterX = rect.left + rect.width / 2;
                const maxBubbleWidth = Math.min(280, viewportWidth - 60);
                
                if (flowCenterX - maxBubbleWidth / 2 < 30) {
                  setAlignment('left');
                } else if (flowCenterX + maxBubbleWidth / 2 > viewportWidth - 30) {
                  setAlignment('right');
                } else {
                  setAlignment('center');
                }
              }
            };
            checkPosition();
            window.addEventListener('scroll', checkPosition, { passive: true });
            window.addEventListener('resize', checkPosition, { passive: true });
            return () => {
              window.removeEventListener('scroll', checkPosition);
              window.removeEventListener('resize', checkPosition);
            };
          }, [show]);
          
          if (!show || !message) return null;
          
          const isTop = position === 'top';
          return (
            <Box 
              onMouseEnter={() => setIsHovered(true)}
              onMouseLeave={() => setIsHovered(false)}
              sx={{
              position: 'absolute',
              [isTop ? 'bottom' : 'top']: 'calc(100% - 2px)',
              ...(alignment === 'center' ? {
                left: '50%',
                transform: `translateX(-50%) translateZ(0) scale(${isHovered ? 1.05 : 1})`
              } : alignment === 'left' ? {
                left: '30px',
                transform: `translateZ(0) scale(${isHovered ? 1.05 : 1})`
              } : {
                right: '30px',
                transform: `translateZ(0) scale(${isHovered ? 1.05 : 1})`
              }),
              transformOrigin: isTop ? 'bottom center' : 'top center',
              background: isHovered 
                ? 'linear-gradient(135deg, rgba(251, 191, 36, 1), rgba(245, 158, 11, 1))'
                : 'linear-gradient(135deg, rgba(251, 191, 36, 0.98), rgba(245, 158, 11, 0.98))',
              color: '#1a1a1a',
              padding: { xs: '12px 16px', sm: '14px 18px' },
              borderRadius: '12px',
              fontSize: { xs: '13px', sm: '14px', md: '15px' },
              fontWeight: 600,
              maxWidth: { xs: 'min(280px, calc(100vw - 60px))', sm: '260px', md: '280px' },
              width: 'max-content',
              textAlign: 'center',
              lineHeight: 1.4,
              boxShadow: isHovered
                ? '0 8px 24px rgba(251, 191, 36, 0.45), 0 0 16px rgba(251, 191, 36, 0.25)'
                : '0 6px 20px rgba(251, 191, 36, 0.35)',
              animation: 'flow-hint-bubble 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)',
              zIndex: 10001,
              whiteSpace: 'normal',
              wordWrap: 'break-word',
              backfaceVisibility: 'hidden',
              WebkitFontSmoothing: 'antialiased',
              willChange: 'transform, opacity',
              cursor: 'default',
              transition: 'all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)',
              '&::after': {
                content: '""',
                position: 'absolute',
                [isTop ? 'bottom' : 'top']: '-7px',
                left: '50%',
                transform: 'translateX(-50%)',
                width: 0,
                height: 0,
                borderLeft: '7px solid transparent',
                borderRight: '7px solid transparent',
                [isTop ? 'borderTop' : 'borderBottom']: isHovered
                  ? '7px solid rgba(245, 158, 11, 1)'
                  : '7px solid rgba(245, 158, 11, 0.98)',
                transition: 'border-color 0.25s ease'
              }
            }}>
              {message}
            </Box>
          );
        };

        // FlowEmojiReaction Component
        const FlowEmojiReaction = ({ emoji }) => {
          if (!emoji) return null;
          
          // Check if emoji would overflow viewport
          const [emojiPosition, setEmojiPosition] = React.useState({ top: '12%', left: '105%' });
          
          React.useEffect(() => {
            const checkPosition = () => {
              const flowEl = document.querySelector('[data-flow-avatar]');
              if (flowEl) {
                const rect = flowEl.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                const emojiSize = window.innerWidth < 600 ? 32 : 36;
                
                // Check if positioning to the right would overflow
                if (rect.right + emojiSize + 10 > viewportWidth - 20) {
                  // Position to the left instead
                  setEmojiPosition({ 
                    top: window.innerWidth < 600 ? '12%' : '10%',
                    right: '105%',
                    left: 'auto'
                  });
                } else {
                  // Normal right positioning
                  setEmojiPosition({ 
                    top: window.innerWidth < 600 ? '12%' : '10%',
                    left: window.innerWidth < 600 ? '105%' : '108%'
                  });
                }
              }
            };
            
            checkPosition();
            window.addEventListener('resize', checkPosition, { passive: true });
            return () => window.removeEventListener('resize', checkPosition);
          }, [emoji]);
          
          return (
            <Box sx={{
              position: 'absolute',
              ...emojiPosition,
              fontSize: { xs: '32px', sm: '36px' },
              animation: 'flow-emoji-pop 2s ease-out forwards, flow-emoji-micro-bounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s',
              zIndex: 10001,

              backfaceVisibility: 'hidden',
              transform: 'translateZ(0)',
              willChange: 'transform, opacity'
            }}>
              {emoji}
            </Box>
          );
        };

        // FlowProgressArc Component
        const FlowProgressArc = ({ percent }) => {
          if (percent < 10) return null;
          const radius = 68;
          const strokeWidth = 4;
          const circumference = 2 * Math.PI * radius;
          const offset = circumference - (percent / 100) * circumference;
          return (
            <svg style={{
              position: 'absolute',
              top: `-${strokeWidth}px`,
              left: `-${strokeWidth}px`,
              width: `calc(100% + ${strokeWidth * 2}px)`,
              height: `calc(100% + ${strokeWidth * 2}px)`,
              transform: 'rotate(-90deg) translateZ(0)',
              pointerEvents: 'none',
              zIndex: 9999,
              filter: 'drop-shadow(0 0 8px rgba(251, 191, 36, 0.6)) drop-shadow(0 6px 20px rgba(251, 191, 36, 0.4))',
              backfaceVisibility: 'hidden',
              willChange: 'transform'
            }}>
              <circle
                cx="50%"
                cy="50%"
                r={radius}
                stroke="rgba(251, 191, 36, 0.12)"
                strokeWidth={strokeWidth}
                fill="none"
              />
              <circle
                cx="50%"
                cy="50%"
                r={radius}
                stroke="url(#progressGradient)"
                strokeWidth={strokeWidth}
                fill="none"
                strokeDasharray={circumference}
                strokeDashoffset={offset}
                strokeLinecap="round"
                style={{ 
                  transition: 'stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
                  willChange: 'stroke-dashoffset'
                }}
              />
              <defs>
                <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style={{ stopColor: '#fbbf24', stopOpacity: 1 }}>
                    <animate attributeName="stop-color" values="#fbbf24;#f59e0b;#fbbf24" dur="3s" repeatCount="indefinite" />
                  </stop>
                  <stop offset="50%" style={{ stopColor: '#f59e0b', stopOpacity: 1 }} />
                  <stop offset="100%" style={{ stopColor: '#ea580c', stopOpacity: 1 }}>
                    <animate attributeName="stop-color" values="#ea580c;#fbbf24;#ea580c" dur="3s" repeatCount="indefinite" />
                  </stop>
                </linearGradient>
              </defs>
            </svg>
          );
        };

        // FlowConfetti Component
        const FlowConfetti = ({ trigger }) => {
          const [particles, setParticles] = React.useState([]);
          React.useEffect(() => {
            if (trigger) {
              const colors = ['#fbbf24', '#f59e0b', '#ea580c', '#8b5cf6', '#a78bfa', '#ec4899'];
              const newParticles = Array.from({ length: 30 }, (_, i) => ({
                id: Date.now() + i,
                x: (Math.random() * 280 - 140) * (0.8 + Math.random() * 0.4),
                y: (Math.random() * 280 - 140) * (0.8 + Math.random() * 0.4),
                color: colors[Math.floor(Math.random() * colors.length)],
                delay: Math.random() * 0.4,
                rotation: Math.random() * 360,
                scale: 0.7 + Math.random() * 0.6
              }));
              setParticles(newParticles);
              setTimeout(() => setParticles([]), 2800);
            }
          }, [trigger]);
          return (
            <>
              {particles.map(p => (
                <Box key={p.id} sx={{
                  position: 'absolute',
                  top: '50%',
                  left: '50%',
                  width: `${10 * p.scale}px`,
                  height: `${10 * p.scale}px`,
                  background: p.color,
                  borderRadius: '50%',
                  boxShadow: `0 2px 6px rgba(0,0,0,0.35), 0 0 ${8 * p.scale}px ${p.color}`,
                  '--x': `${p.x}px`,
                  '--y': `${p.y}px`,
                  animation: `flow-confetti-burst ${1.5 + p.delay * 0.5}s cubic-bezier(0.25, 0.46, 0.45, 0.94) ${p.delay}s forwards`,
                  zIndex: 10002,
                  transform: `rotate(${p.rotation}deg) translateZ(0)`,
                  willChange: 'transform, opacity'
                }} />
              ))}
            </>
          );
        };

        React.useEffect(() => {
          // Check for reduced motion preference
          const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (prefersReducedMotion) {
            setFlowState(prev => ({ ...prev, active: false }));
            return;
          }

          // Phase 2: Returning Visitor Recognition
          const visitData = localStorage.getItem('flow_visit_data');
          const visitCount = visitData ? JSON.parse(visitData).count + 1 : 1;
          localStorage.setItem('flow_visit_data', JSON.stringify({
            count: visitCount,
            lastVisit: Date.now()
          }));
          
          if (visitCount > 1) {
            setFlowState(prev => ({ 
              ...prev, 
              returningVisitor: true,
              visitCount: visitCount,
              hintMessage: visitCount === 2 ? '🎉 Welcome back!' : `✨ Visit #${visitCount}!`,
              showHintBubble: true,
              emojiReaction: '👋'
            }));
            setTimeout(() => setFlowState(prev => ({ ...prev, showHintBubble: false, emojiReaction: null })), 3500);
          }

          // Track user engagement behaviors
          let idleTimer = null;
          let scrollTimer = null;
          let lastScrollY = window.scrollY;
          let lastScrollTime = Date.now();
          let focusedInput = null;

          const trackEngagement = () => {
            setFlowState(prev => ({ ...prev, userEngaged: true }));
            clearTimeout(idleTimer);
            
            // Reset to idle after 5 seconds
            idleTimer = setTimeout(() => {
              setFlowState(prev => ({ ...prev, userEngaged: false }));
            }, 5000);
          };

          // Phase 1: Smart Form Validation Hints
          const formValidationHints = {
            email: (value) => {
              if (!value) return '📧 Enter your email';
              if (!value.includes('@')) return '✏️ Add @ sign';
              if (!value.includes('.')) return '🎯 Add .com';
              return null;
            }
          };

          // Phase 2: Reading Speed Detection
          let sectionStartTime = null;
          let wordsInSection = 0;
          const calculateReadingSpeed = (timeSpent, words) => {
            const wpm = words / (timeSpent / 60000); // words per minute
            if (wpm < 150) return 'slow';
            if (wpm < 250) return 'normal';
            return 'fast';
          };

          // Phase 2: Scroll Hesitation Detection
          const handleScroll = () => {
            const currentScrollY = window.scrollY;
            const currentTime = Date.now();
            const scrollDelta = Math.abs(currentScrollY - lastScrollY);
            const timeDelta = currentTime - lastScrollTime;

            // Detect hesitation (stopped scrolling for 3-5 seconds in middle of content)
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
              const scrollPercent = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
              if (scrollPercent > 20 && scrollPercent < 80) {
                setFlowState(prev => ({
                  ...prev,
                  scrollHesitation: true,
                  hintMessage: '💬 Need help?',
                  showHintBubble: true,
                  gesture: 'wave'
                }));
                setTimeout(() => setFlowState(prev => ({ 
                  ...prev, 
                  scrollHesitation: false,
                  showHintBubble: false
                })), 4000);
              }
            }, 4000);

            lastScrollY = currentScrollY;
            lastScrollTime = currentTime;

            // Phase 2: Progress Tracking
            const progress = Math.min(100, Math.round((currentScrollY / (document.body.scrollHeight - window.innerHeight)) * 100));
            setFlowState(prev => ({ ...prev, progressPercent: progress }));
          };

          // Phase 2: Proximity Awareness (mouse tracking on desktop)
          const handleMouseMove = (e) => {
            if (window.innerWidth < 768) return; // Skip on mobile
            
            const flowEl = document.querySelector('[data-flow-avatar]');
            if (!flowEl) return;
            
            const rect = flowEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const distance = Math.sqrt(
              Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2)
            );
            
            // Proximity levels: 0-150px = close, 150-300px = near, 300+ = far
            let proximity = 0;
            if (distance < 150) {
              proximity = 3; // Very close
              setFlowState(prev => ({
                ...prev,
                proximityLevel: proximity,
                hintMessage: '😊 Hi!',
                showHintBubble: true,
                gesture: 'wave'
              }));
              setTimeout(() => setFlowState(prev => ({ ...prev, showHintBubble: false })), 1800);
            } else if (distance < 300) {
              proximity = 2; // Near
            } else {
              proximity = 0; // Far
            }
            
            setFlowState(prev => ({ ...prev, proximityLevel: proximity }));
          };

          // Monitor button clicks - celebrate with confetti!
          const handleButtonClick = (e) => {
            if (e.target.closest('button')) {
              trackEngagement();
              setFlowState(prev => ({ 
                ...prev, 
                gesture: 'celebrate', 
                contextualHint: 'action',
                emojiReaction: '🎉',
                showConfetti: true
              }));
              setTimeout(() => {
                setFlowState(prev => ({ 
                  ...prev, 
                  gesture: prev.section === 'waitlist' ? 'excited-bounce' : 'breathe',
                  contextualHint: null,
                  emojiReaction: null,
                  showConfetti: false
                }));
              }, 2000);
              
              // Track conversion probability increase on CTA clicks
              setFlowState(prev => ({
                ...prev,
                conversionProbability: Math.min(1, prev.conversionProbability + 0.15)
              }));
            }
          };

          // Monitor form inputs - nod acknowledgment + smart validation
          const handleFormFocus = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
              trackEngagement();
              focusedInput = e.target;
              setFlowState(prev => ({ 
                ...prev, 
                contextualHint: 'typing', 
                gesture: 'nod',
                formAbandoned: false
              }));
            }
          };

          const handleFormInput = (e) => {
            if (e.target.type === 'email' && formValidationHints.email) {
              const hint = formValidationHints.email(e.target.value);
              if (hint) {
                setFlowState(prev => ({
                  ...prev,
                  hintMessage: hint,
                  showHintBubble: true,
                  gesture: 'nod'
                }));
              } else {
                setFlowState(prev => ({
                  ...prev,
                  hintMessage: 'Perfect! 🎯',
                  showHintBubble: true,
                  gesture: 'celebrate',
                  emojiReaction: '✅'
                }));
                setTimeout(() => setFlowState(prev => ({ 
                  ...prev, 
                  showHintBubble: false,
                  emojiReaction: null
                })), 1500);
              }
            }
          };

          const handleFormBlur = () => {
            focusedInput = null;
            setTimeout(() => {
              setFlowState(prev => ({ ...prev, contextualHint: null, showHintBubble: false }));
            }, 800);
          };

          // Phase 2: Form Abandonment Recovery
          let abandonmentTimer = null;
          const handleFormStart = () => {
            abandonmentTimer = setTimeout(() => {
              if (!document.querySelector('input:focus') && !document.querySelector('textarea:focus')) {
                setFlowState(prev => ({
                  ...prev,
                  formAbandoned: true,
                  hintMessage: '💡 Need help?',
                  showHintBubble: true,
                  gesture: 'wave'
                }));
                setTimeout(() => setFlowState(prev => ({ 
                  ...prev, 
                  formAbandoned: false,
                  showHintBubble: false
                })), 5000);
              }
            }, 15000); // 15 seconds of inactivity
          };

          // Attach interaction listeners
          document.addEventListener('click', handleButtonClick);
          document.addEventListener('focus', handleFormFocus, true);
          document.addEventListener('blur', handleFormBlur, true);
          document.addEventListener('input', handleFormInput, true);
          document.addEventListener('scroll', handleScroll, { passive: true });
          document.addEventListener('mousemove', handleMouseMove, { passive: true });

          // Start abandonment timer on form interaction
          const formInputs = document.querySelectorAll('input, textarea');
          formInputs.forEach(input => {
            input.addEventListener('focus', handleFormStart, { once: true });
          });

          // Intersection Observer for section tracking with Phase 3 hints
          const sectionHints = {
            hero: '🚀 Welcome!',
            meetflow: '🤖 Meet Flow',
            opportunity: '✨ Discover',
            workflow: '🔄 How it works',
            templates: '📋 Ready to use',
            services: '🌐 Full ecosystem',
            faq: '💡 Got questions?',
            waitlist: '🎯 Join now!'
          };

          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  const section = entry.target.getAttribute('data-flow-section');
                  if (section) {
                    // Record section start time for reading speed calculation
                    sectionStartTime = Date.now();
                    wordsInSection = (entry.target.textContent || '').split(/\s+/).length;

                    const sectionGestures = {
                      hero: 'wave',
                      meetflow: 'sway',
                      opportunity: 'bounce',
                      workflow: 'bounce',
                      templates: 'sway',
                      services: 'bounce',
                      faq: 'nod',
                      waitlist: 'excited-bounce'
                    };
                    
                    setFlowState(prev => ({
                      ...prev,
                      section: section,
                      gesture: sectionGestures[section] || 'breathe',
                      active: true,
                      contextualHint: section === 'waitlist' ? 'conversion' : 
                                     section === 'opportunity' ? 'interactive' :
                                     section === 'workflow' ? 'learning' : prev.contextualHint,
                      aiHint: sectionHints[section] || null,
                      hintMessage: sectionHints[section] || '',
                      showHintBubble: true
                    }));

                    // Phase 3: Predictive Next-Step
                    const nextSections = {
                      hero: 'meetflow',
                      meetflow: 'opportunity',
                      opportunity: 'workflow',
                      workflow: 'templates',
                      templates: 'services',
                      services: 'faq',
                      faq: 'waitlist'
                    };
                    setFlowState(prev => ({
                      ...prev,
                      nextSuggestedSection: nextSections[section] || null
                    }));

                    // Hide hint after 3 seconds
                    setTimeout(() => setFlowState(prev => ({ ...prev, showHintBubble: false })), 3000);

                    // Track section views
                    if (window.trackEvent) {
                      window.trackEvent('flow_section_guide', {
                        section: section,
                        timestamp: Date.now(),
                        conversionProbability: flowState.conversionProbability
                      });
                    }
                  }
                } else {
                  // Calculate reading speed when leaving section
                  if (sectionStartTime && wordsInSection > 0) {
                    const timeSpent = Date.now() - sectionStartTime;
                    const speed = calculateReadingSpeed(timeSpent, wordsInSection);
                    setFlowState(prev => ({ ...prev, readingSpeed: speed }));
                  }
                }
              });
            },
            { threshold: 0.3, rootMargin: '-10% 0px -10% 0px' }
          );

          // Observe all sections
          const sections = document.querySelectorAll('[data-flow-section]');
          sections.forEach(section => observer.observe(section));

          // Phase 3: Time-based urgency messaging (after 2 minutes)
          const urgencyTimer = setTimeout(() => {
            if (flowState.section !== 'waitlist') {
              setFlowState(prev => ({
                ...prev,
                hintMessage: '⚡ Limited spots!',
                showHintBubble: true,
                gesture: 'excited-bounce'
              }));
              setTimeout(() => setFlowState(prev => ({ ...prev, showHintBubble: false })), 4000);
            }
          }, 120000); // 2 minutes

          return () => {
            clearTimeout(idleTimer);
            clearTimeout(scrollTimer);
            clearTimeout(abandonmentTimer);
            clearTimeout(urgencyTimer);
            sections.forEach(section => observer.unobserve(section));
            document.removeEventListener('click', handleButtonClick);
            document.removeEventListener('focus', handleFormFocus, true);
            document.removeEventListener('blur', handleFormBlur, true);
            document.removeEventListener('input', handleFormInput, true);
            document.removeEventListener('scroll', handleScroll);
            document.removeEventListener('mousemove', handleMouseMove);
          };
        }, []);

        return (
          <ThemeProvider theme={theme}>
            <CssBaseline />
            <style>
              {`
                /* All Flow companion styles removed - purely decorative now */
              `}
            </style>
            <Box
              sx={{
                minHeight: "100vh",
                background:
                  "radial-gradient(circle at 10% 20%, rgba(99,102,241,0.12), transparent 50%), radial-gradient(circle at 80% 0%, rgba(14,165,233,0.16), transparent 55%)",
                display: "flex",
                flexDirection: "column",
                width: "100%",
                overflowX: "hidden",
                position: "relative"
              }}
            >
              {/* Flow Companion - Enhanced Phase 1-3 */}
              <Box
                id="flowCompanion"
                data-flow-avatar
                data-flow-section={flowState.section}
                data-flow-gesture={flowState.gesture}
                data-flow-context={flowState.contextualHint}
                onClick={() => {
                  // Phase 1: Click-to-expand interaction
                  if (flowState.aiHint || flowState.nextSuggestedSection) {
                    setFlowState(prev => ({
                      ...prev,
                      showHintBubble: !prev.showHintBubble,
                      hintMessage: prev.aiHint || `Next: ${prev.nextSuggestedSection}`,
                      emojiReaction: '💡'
                    }));
                    setTimeout(() => setFlowState(prev => ({ 
                      ...prev, 
                      emojiReaction: null 
                    })), 2000);
                  }
                }}
                sx={{
                  position: 'fixed',
                  bottom: flowState.section === 'hero' ? { xs: 'clamp(60px, 42vh, calc(100vh - 240px))', sm: '38vh', md: '35vh' } :
                          flowState.section === 'meetflow' ? { xs: 'clamp(60px, 38vh, calc(100vh - 240px))', sm: '33vh', md: '28vh' } :
                          flowState.section === 'opportunity' ? { xs: 'clamp(60px, 48vh, calc(100vh - 240px))', sm: '43vh', md: '38vh' } :
                          flowState.section === 'workflow' ? { xs: 'clamp(60px, 43vh, calc(100vh - 240px))', sm: '38vh', md: '33vh' } :
                          flowState.section === 'templates' ? { xs: 'clamp(60px, 40vh, calc(100vh - 240px))', sm: '35vh', md: '30vh' } :
                          flowState.section === 'services' ? { xs: 'clamp(60px, 45vh, calc(100vh - 240px))', sm: '40vh', md: '35vh' } :
                          flowState.section === 'faq' ? { xs: 'clamp(60px, 38vh, calc(100vh - 240px))', sm: '33vh', md: '28vh' } :
                          flowState.section === 'waitlist' ? { xs: 'clamp(60px, 25vh, calc(100vh - 240px))', sm: '22vh', md: '18vh' } :
                          { xs: 60, sm: 50, md: 90 },
                  right: flowState.section === 'hero' ? { xs: 'clamp(10px, 8vw, 30px)', sm: '6vw', md: '4vw' } :
                         flowState.section === 'meetflow' ? { xs: 'clamp(10px, 12vw, 35px)', sm: '10vw', md: '8vw' } :
                         flowState.section === 'opportunity' ? { xs: 'clamp(10px, 4vw, 20px)', sm: '3vw', md: '2vw' } :
                         flowState.section === 'waitlist' ? { xs: 'clamp(10px, 6vw, 25px)', sm: '4vw', md: '3vw' } :
                         { xs: 12, sm: 16, md: 20 },
                  left: flowState.section === 'meetflow' ? { xs: 'auto', sm: 'auto', md: '12vw' } : 'auto',
                  width: flowState.section === 'waitlist' ? 
                         { xs: '144px', sm: '156px', md: '168px' } : 
                         flowState.contextualHint === 'exploring' || flowState.contextualHint === 'action' ? 
                         { xs: '132px', sm: '144px', md: '156px' } :
                         { xs: '120px', sm: '132px', md: '144px' },
                  height: flowState.section === 'waitlist' ? 
                          { xs: '144px', sm: '156px', md: '168px' } : 
                          flowState.contextualHint === 'exploring' || flowState.contextualHint === 'action' ? 
                          { xs: '132px', sm: '144px', md: '156px' } :
                          { xs: '120px', sm: '132px', md: '144px' },
                  zIndex: 9998,
                  pointerEvents: 'auto',
                  cursor: 'pointer',
                  filter: flowState.section === 'waitlist' ? 
                          'drop-shadow(0 6px 16px rgba(251, 191, 36, 0.6)) drop-shadow(0 0 20px rgba(251, 191, 36, 0.4))' :
                          flowState.contextualHint === 'action' ?
                          'drop-shadow(0 5px 14px rgba(139, 92, 246, 0.5)) drop-shadow(0 0 18px rgba(99, 102, 241, 0.3))' :
                          flowState.userEngaged ?
                          'drop-shadow(0 5px 12px rgba(251, 191, 36, 0.45)) drop-shadow(0 0 16px rgba(251, 191, 36, 0.25))' :
                          flowState.proximityLevel > 2 ?
                          'drop-shadow(0 5px 14px rgba(251, 191, 36, 0.5)) drop-shadow(0 0 18px rgba(139, 92, 246, 0.25))' :
                          'drop-shadow(0 4px 10px rgba(251, 191, 36, 0.4))',
                  transition: 'width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.6s ease',
                  willChange: flowState.active ? 'transform, filter' : 'auto',
                  backfaceVisibility: 'hidden',
                  WebkitFontSmoothing: 'antialiased',
                  transform: 'translateZ(0)',
                  background: 'transparent',
                  overflow: 'visible',
                  border: 'none',
                  outline: 'none',
                  boxShadow: 'none',
                  animation: flowState.active ? 
                    (flowState.gesture === 'wave' ? 'flow-wave 2s ease-in-out 1, flow-breathe 3s ease-in-out infinite 2s' :
                     flowState.gesture === 'bounce' ? 'flow-bounce 0.8s ease-in-out infinite' :
                     flowState.gesture === 'bounce-point' ? 'flow-bounce-point 0.8s ease-in-out infinite' :
                     flowState.gesture === 'sway' ? 'flow-sway 4s ease-in-out infinite' :
                     flowState.gesture === 'orbit' ? 'flow-orbit 8s linear infinite' :
                     flowState.gesture === 'celebrate' ? 'flow-spin-celebrate 2s ease-out 1, flow-glow-pulse 2s ease-out 1' :
                     flowState.gesture === 'nod' ? 'flow-nod 1.2s ease-in-out 2, flow-breathe 3s ease-in-out infinite 2.4s' :
                     flowState.gesture === 'excited-bounce' ? 'flow-excited-bounce 0.4s ease-in-out infinite, flow-glow-pulse 1s ease-in-out infinite' :
                     'flow-breathe 3s ease-in-out infinite, flow-subtle-glow 4s ease-in-out infinite') :
                    'none',
                  display: flowState.active ? 'block' : 'none',
                  '&:hover': {
                    transform: 'scale(1.08)',
                    filter: 'drop-shadow(0 6px 18px rgba(251, 191, 36, 0.7)) drop-shadow(0 0 22px rgba(139, 92, 246, 0.4))'
                  }
                }}
              >
                {/* Phase 2: Progress Arc */}
                <FlowProgressArc percent={flowState.progressPercent} />
                
                {/* Phase 1: Hint Bubble */}
                <FlowHintBubble message={flowState.hintMessage} show={flowState.showHintBubble} />
                
                {/* Phase 1: Emoji Reaction */}
                <FlowEmojiReaction emoji={flowState.emojiReaction} />
                
                {/* Phase 1: Confetti */}
                <FlowConfetti trigger={flowState.showConfetti} />
                
                {/* Flow Avatar Image */}
                <Box
                  component="img"
                  src="flownobackground.png"
                  alt="Flow - Your AI Companion"
                  draggable="false"
                  sx={{
                    width: '100%',
                    height: '100%',
                    objectFit: 'contain',
                    imageRendering: '-webkit-optimize-contrast',
                    backfaceVisibility: 'hidden',
                    transform: 'translateZ(0)',
                    willChange: 'transform',
                    userSelect: 'none',
                    pointerEvents: 'none'
                  }}
                />
              </Box>

              <Box
                sx={{
                  position: 'fixed',
                  bottom: 20,
                  right: 20,
                  zIndex: 9999,
                  display: 'flex',
                  alignItems: 'center',
                  gap: 1.5,
                  background: 'rgba(10, 12, 24, 0.95)',
                  backdropFilter: 'blur(10px)',
                  borderRadius: '50px',
                  padding: '12px 20px',
                  border: '1px solid rgba(251, 191, 36, 0.3)',
                  boxShadow: '0 8px 32px rgba(15, 23, 42, 0.6)'
                }}
              >
                <audio id="bgMusic" loop>
                  <source src="let-it-flow.m4a" type="audio/mp4" />
                </audio>
                <Button
                  onClick={() => {
                    const audio = document.getElementById('bgMusic');
                    const btn = document.getElementById('musicBtn');
                    if (audio.paused) {
                      audio.play();
                      btn.textContent = '🔊';
                    } else {
                      audio.pause();
                      btn.textContent = '🔇';
                    }
                  }}
                  id="musicBtn"
                  sx={{
                    color: '#fbbf24',
                    fontSize: '1.5rem',
                    minWidth: 'auto',
                    padding: 0,
                    '&:hover': {
                      background: 'transparent',
                      color: '#f59e0b'
                    }
                  }}
                >
                  🔇
                </Button>
                <Typography
                  variant="caption"
                  sx={{
                    color: '#f8fafc',
                    fontWeight: 600,
                    fontSize: '0.875rem'
                  }}
                >
                  Let It Flow
                </Typography>
              </Box>

              <Container maxWidth="lg" sx={{ 
                py: { xs: 'clamp(2rem, 6vw, 2.5rem)', sm: 'clamp(2.5rem, 7vw, 3.5rem)', md: 'clamp(3rem, 8vw, 5rem)' }, 
                px: { xs: 2, sm: 3, md: 4 },
                width: "100%", 
                position: "relative", 
                zIndex: 1 
              }}>
                <Stack spacing={{ xs: 'clamp(2rem, 5vw, 3.5rem)', md: 'clamp(3.5rem, 8vw, 5.5rem)' }} alignItems="center">
                  <Box data-flow-section="hero" sx={{ width: "100%" }}>
                    <HeroSection />
                  </Box>
                  <FlowLine variant="pulse" />
                  <Box data-flow-section="meetflow" sx={{ width: "100%" }}>
                    <SocialProof />
                  </Box>
                  <FlowLine variant="default" />
                  <Box data-flow-section="opportunity" sx={{ width: "100%" }}>
                    <OpportunityFinderShowcase workflowRef={workflowRef} />
                  </Box>
                  <FlowLine variant="short" />
                  <Box data-flow-section="workflow" sx={{ width: "100%" }}>
                    <WorkflowBuilder />
                  </Box>
                  <FlowLine variant="default" />
                  <Box data-flow-section="templates" sx={{ width: "100%" }}>
                    <TemplateShowcase />
                  </Box>
                  <FlowLine variant="short" />
                  <Box data-flow-section="services" sx={{ width: "100%" }}>
                    <PoweredByServices />
                  </Box>
                  <FlowLine variant="pulse" />
                  <Box data-flow-section="faq" sx={{ width: "100%" }}>
                    <FAQ />
                  </Box>
                  <FlowLine variant="short" />
                  <Box data-flow-section="waitlist" sx={{ width: "100%" }}>
                    <WaitlistSignup />
                  </Box>
                </Stack>
              </Container>
              <Footer />
            </Box>
          </ThemeProvider>
        );
      }

      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
