apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affiliate-flow-ingress
  namespace: affiliate-flow
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - api.affiliateflow.com  # Replace with your domain
    secretName: affiliate-flow-tls
  rules:
  - host: api.affiliateflow.com  # Replace with your domain
    http:
      paths:
      - path: /api/orchestrator
        pathType: Prefix
        backend:
          service:
            name: orchestrator-service
            port:
              number: 80
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: product-mapper-service
            port:
              number: 80
      - path: /api/trends
        pathType: Prefix
        backend:
          service:
            name: trend-finder-service
            port:
              number: 80
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
