apiVersion: v1
kind: Namespace
metadata:
  name: affiliate-flow
  labels:
    name: affiliate-flow
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: affiliate-flow
  annotations:
    iam.gke.io/gcp-service-account: affiliate-flow-orchestrator@affiliateflow-abzfy.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: content-gen-sa
  namespace: affiliate-flow
  annotations:
    iam.gke.io/gcp-service-account: affiliate-flow-content-gen@affiliateflow-abzfy.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-ai-orchestrator
  namespace: affiliate-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator-sa
      containers:
      - name: orchestrator
        image: us-central1-docker.pkg.dev/affiliateflow-abzfy/affiliate-flow-images/master-ai-orchestrator:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PROJECT_ID
          value: "affiliateflow-abzfy"
        - name: GOOGLE_CLOUD_PROJECT
          value: "affiliateflow-abzfy"
        - name: REGION
          value: "us-central1"
        - name: PORT
          value: "8080"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api
              key: api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: affiliate-flow
spec:
  selector:
    app: orchestrator
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
  namespace: affiliate-flow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: master-ai-orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
