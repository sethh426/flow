apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-mapper
  namespace: affiliate-flow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-mapper
  template:
    metadata:
      labels:
        app: product-mapper
    spec:
      serviceAccountName: content-gen-sa
      containers:
      - name: product-mapper
        image: us-central1-docker.pkg.dev/affiliateflow-abzfy/affiliate-flow-images/product-mapper:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: PROJECT_ID
          value: "affiliateflow-abzfy"
        - name: REGION
          value: "us-central1"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api
              key: api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-mapper-service
  namespace: affiliate-flow
spec:
  selector:
    app: product-mapper
  ports:
  - port: 80
    targetPort: 8081
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-mapper-hpa
  namespace: affiliate-flow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-mapper
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
