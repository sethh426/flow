apiVersion: apps/v1
kind: Deployment
metadata:
  name: trend-finder
  namespace: affiliate-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trend-finder
  template:
    metadata:
      labels:
        app: trend-finder
    spec:
      serviceAccountName: content-gen-sa
      containers:
      - name: trend-finder
        image: us-central1-docker.pkg.dev/affiliateflow-abzfy/affiliate-flow-images/trend-finder:latest
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: PROJECT_ID
          value: "affiliateflow-abzfy"
        - name: REGION
          value: "us-central1"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api
              key: api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trend-finder-service
  namespace: affiliate-flow
spec:
  selector:
    app: trend-finder
  ports:
  - port: 80
    targetPort: 8082
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trend-finder-hpa
  namespace: affiliate-flow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trend-finder
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
